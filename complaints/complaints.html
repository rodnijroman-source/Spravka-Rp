<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="/templates.css">
    <link rel="stylesheet" href="/complaints/complaints.css">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>
    <div class="hot-bar-container">
        <a href="/index.html">Главная</a>
        <a href="/complaints/complaints.html">Жалобы</a>
        <a href="/explanations/explanations.html">Как Играть</a>

    <lottie-player 
        src="/animations/document.json" 
        background="transparent" 
        speed="1" 
        style="width: 300px; height: 300px; margin-top: 100px;"

        class="smooth">

    <div id="complaintsList"></div>

        <input type="text" id="msgInput" placeholder="Что сделал" required>
        <button type="submit">Отправить жалобу</button>
